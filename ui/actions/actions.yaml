{
  "actions": [
    {
      "action_id": "find",
      "workflow_visible": true,
      "title": "Find",
      "description": "Find up to 100 documents with optional projection and ordered sort. Results use canonical Extended JSON.",
      "required_scopes": [
        "extension:invoke"
      ],
      "handler": {
        "mode": "extension"
      },
      "parameters": [
        {
          "name": "connection_ref",
          "type": "string",
          "required": true
        },
        {
          "name": "collection",
          "type": "string",
          "required": true
        },
        {
          "name": "filter",
          "type": "object",
          "required": false
        },
        {
          "name": "projection",
          "type": "object",
          "required": false
        },
        {
          "name": "sort",
          "type": "object",
          "required": false
        },
        {
          "name": "limit",
          "type": "integer",
          "required": false
        }
      ],
      "result_fields": [
        "result.collection",
        "result.documents",
        "result.count",
        "result.found"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "unknown_action",
        "effect_claim_required",
        "test_mode_suppressed",
        "authentication_failed",
        "provider_unavailable",
        "native_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "network_blocked",
        "timeout"
      ],
      "mutates_platform": false
    },
