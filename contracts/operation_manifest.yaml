{
  "operations": [
    {
      "operation_id": "find",
      "display_name": "Find matching documents",
      "description": "Read up to 100 MongoDB documents using a filter, optional projection and ordered sort. Results use canonical Extended JSON.",
      "operation_kind": "action",
      "workflow_visible": true,
      "connection_type_ids": [
        "mongodb"
      ],
      "category": "data",
      "inputs": [
        {
          "name": "connection_ref",
          "value_type": "connection_ref",
          "required": true,
          "display_name": "Project connection"
        },
        {
          "name": "collection",
          "value_type": "text",
          "required": true,
          "display_name": "Collection name",
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          }
        },
        {
          "name": "filter",
          "value_type": "json",
          "required": false,
          "display_name": "Document filter (JSON)",
          "schema": {
            "type": "object"
          }
        },
        {
          "name": "projection",
          "value_type": "json",
          "required": false,
          "display_name": "Fields to return (JSON)",
          "schema": {
            "type": "object"
          }
        },
        {
          "name": "sort",
          "value_type": "json",
          "required": false,
          "display_name": "Sort fields and directions (JSON)",
          "schema": {
            "type": "object"
          }
        },
        {
          "name": "limit",
          "value_type": "integer",
          "required": false,
          "display_name": "Maximum results",
          "schema": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100,
            "default": 20
          }
        }
      ],
      "outputs": [
        {
          "name": "collection",
          "value_type": "text"
        },
        {
          "name": "documents",
          "value_type": "json"
        },
        {
          "name": "count",
          "value_type": "integer"
        },
        {
          "name": "found",
          "value_type": "boolean"
        }
      ],
      "result_fields": [
        "result.collection",
        "result.documents",
        "result.count",
        "result.found"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "unknown_action",
        "effect_claim_required",
        "test_mode_suppressed",
        "authentication_failed",
        "provider_unavailable",
        "native_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "network_blocked",
        "timeout"
      ]
    },
