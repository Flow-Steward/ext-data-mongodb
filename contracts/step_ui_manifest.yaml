        {
          "name": "documents",
          "widget_type": "json",
          "label": "New documents (JSON)",
          "required": true,
          "help_text": "Array of 1–100 nonempty MongoDB documents. A failed batch may already have inserted some documents; inspect before repeating it.",
          "placeholder": "[{\"_id\":\"order_1042\",\"status\":\"pending\"}]"
        }
      ]
    },
