          "placeholder": "orders"
        },
        {
          "name": "document",
          "widget_type": "json",
          "label": "New document (JSON)",
          "required": true,
          "help_text": "Nonempty MongoDB document. A caller-supplied stable _id helps detect duplicate submissions; duplicate IDs fail rather than update.",
          "placeholder": "{\"_id\":\"order_1042\",\"status\":\"pending\"}"
        }
      ]
    },
    {
      "operation_id": "insert_many",
