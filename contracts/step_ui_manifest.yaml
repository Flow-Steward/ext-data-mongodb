          "label": "Document filter (JSON)",
          "required": false,
          "help_text": "MongoDB filter object. Reads may use {} to match all documents; update and delete actions require a nonempty filter. Use canonical Extended JSON for BSON-specific values.",
          "placeholder": "{\"status\":\"pending\"}"
        },
        {
          "name": "projection",
          "widget_type": "json",
          "label": "Fields to return (JSON)",
          "required": false,
          "help_text": "Optional MongoDB projection. Use 1 to include fields and 0 to exclude fields; follow MongoDB projection rules.",
          "placeholder": "{\"status\":1,\"total\":1,\"_id\":0}"
        }
      ]
    },
    {
      "operation_id": "aggregate",
      "title": "Run a read-only aggregation pipeline",
      "fields": [
        {
          "name": "collection",
          "widget_type": "textarea",
          "label": "Collection name",
          "required": true,
          "help_text": "MongoDB collection in the database configured on the connection. Use a collection name, not a database-qualified name.",
          "placeholder": "orders"
        },
        {
          "name": "pipeline",
          "widget_type": "json",
          "label": "Read-only aggregation stages (JSON)",
          "required": true,
          "help_text": "Array of up to 16 supported stages, for example $match then $group. No $lookup, $unionWith, $out, $merge or JavaScript; output is bounded by Maximum results.",
          "placeholder": "[{\"$match\":{\"status\":\"approved\"}},{\"$group\":{\"_id\":\"$status\",\"count\":{\"$sum\":1}}}]"
        },
        {
          "name": "limit",
          "widget_type": "integer",
          "label": "Maximum results",
          "required": false,
          "help_text": "Maximum records to return in this call, from 1 to 100. This is not an automatic all-pages read.",
          "placeholder": "20"
        }
      ]
    },
    {
      "operation_id": "insert_one",
      "title": "Insert one new document",
      "fields": [
        {
          "name": "collection",
          "widget_type": "textarea",
          "label": "Collection name",
          "required": true,
