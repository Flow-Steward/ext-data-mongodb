{
  "connection_types": [
    {
      "connection_type_id": "mongodb",
      "display_name": "MongoDB",
      "description": "Standalone, replica discovery or SRV. Database is fixed by the connection; each action selects a collection. Verified TLS is required for public servers.",
      "config_schema": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "host",
          "database"
        ],
        "properties": {
          "host": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253,
            "title": "Server or SRV hostname"
          },
          "port": {
            "type": "integer",
            "minimum": 1,
            "maximum": 65535,
            "default": 27017
          },
          "srv": {
            "type": "boolean",
            "default": false
          },
          "tls": {
            "type": "boolean",
            "default": true
          },
          "database": {
            "type": "string",
            "minLength": 1,
            "maxLength": 63
          },
          "auth_source": {
            "type": "string",
            "minLength": 1,
            "maxLength": 63,
            "default": "admin"
          },
          "request_timeout_seconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 30,
            "default": 15
          }
        }
      },
      "secret_schema": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "username": {
            "type": "string",
            "maxLength": 8192,
            "title": "Username"
          },
          "password": {
            "type": "string",
            "maxLength": 8192,
            "title": "Password"
          }
        }
      },
      "capabilities": {
        "test_connection": false,
        "live_request": true,
        "workflow_trigger": false,
        "callback_ingress": false
      },
      "safety_profile": {
        "requires_https": false,
        "requires_host_allowlist": true,
        "stores_secret_values": false
      }
    }
  ]
}
